name: Connected catalog build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  connected-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          DISCOVERY_CATALOG_SITE_KEY: catalog-build-verification
          DISCOVERY_PLATFORM_URL: http://127.0.0.1:9
      - run: node scripts/verify-catalog-build.mjs
